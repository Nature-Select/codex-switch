name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-14

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Resolve version
        run: |
          TAG="${GITHUB_REF_NAME:-v0.0.0}"
          echo "VERSION=${TAG#v}" >> "$GITHUB_ENV"
          echo "TARBALL=codex-switch-${TAG#v}-macos-universal.tar.gz" >> "$GITHUB_ENV"

      - name: Self-tests
        run: swift run CodexSwitchSelfTest

      - name: Build universal binary
        run: |
          bash scripts/package.sh
          # A stable name so `releases/latest/download/...` keeps working.
          cp ".build/${TARBALL}" ".build/codex-switch-macos-universal.tar.gz"
          cp ".build/${TARBALL}.sha256" ".build/codex-switch-macos-universal.tar.gz.sha256"

      - name: Point the formula at this release
        run: |
          SHA="$(cat ".build/${TARBALL}.sha256")"
          /usr/bin/sed -i '' \
            -e "s|url \".*\"|url \"https://github.com/${GITHUB_REPOSITORY}/releases/download/v${VERSION}/${TARBALL}\"|" \
            -e "s|sha256 \".*\"|sha256 \"${SHA}\"|" \
            -e "s|version \".*\"|version \"${VERSION}\"|" \
            Formula/codex-switch.rb

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/codex-switch.rb
          git commit -m "chore: point formula at v${VERSION}" || exit 0
          git push origin main

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            .build/${{ env.TARBALL }}
            .build/${{ env.TARBALL }}.sha256
            .build/codex-switch-macos-universal.tar.gz
            .build/codex-switch-macos-universal.tar.gz.sha256
